# Agenda BH — sources
# Every source can be turned off with `enabled: false`.
#
# type: web       -> opens the page in a real browser (Playwright), reads JSON-LD
#                    event data if the site has it, otherwise sends the page
#                    text to the AI to pull out the events.
#   follow_links  -> for news-style sites where the listing only has headlines:
#                    open the matching article links and extract from each one.
#   pages         -> extra pages to read (pagination).
#   scroll        -> how many times to scroll down (for "load more" sites).
#   {date_from} / {date_to} in a URL are filled in on each run.
# type: mapas     -> Mapas Culturais public API (falls back to `web` if it fails).
# type: instagram -> latest posts from a public profile (caption + flyer image).
# type: manual    -> fixed programme typed by hand in eventos_fixos/*.yaml (no AI).

settings:
  window_days: 14          # look ahead this many days
  instagram_max_posts: 12  # posts checked per profile per run
  instagram_max_age_days: 21
  request_delay_seconds: 3 # pause between page loads (be polite)

sources:
  - name: Culturadoria
    type: web
    url: https://culturadoria.com.br/categoria/agenda-cultural/
    pages:
      - https://culturadoria.com.br/categoria/cinema/
      - https://culturadoria.com.br/categoria/exposicao/
      - https://culturadoria.com.br/categoria/teatro/
      - https://culturadoria.com.br/categoria/literatura/
      - https://culturadoria.com.br/categoria/gastronomia/
    follow_links:
      # any article link that isn't a category/tag/author page
      include: ['culturadoria\.com\.br/(?!categoria/|tag/|autor/|author/|page/|wp-)[a-z0-9-]{10,}/?$',
                'culturadoria\.com\.br/\d{4}/\d{2}/[a-z0-9-]+/?$']
      max: 12
    enabled: true

  - name: Sympla
    type: web
    url: https://www.sympla.com.br/eventos/belo-horizonte-mg?category=city
    scroll: 4
    enabled: true

  - name: Portal Belo Horizonte
    type: web
    url: https://portalbelohorizonte.com.br/eventos?page=0
    pages:
      - https://portalbelohorizonte.com.br/eventos?page=1
      - https://portalbelohorizonte.com.br/eventos?page=2
      - https://portalbelohorizonte.com.br/eventos?page=3
    enabled: true

  - name: Agenda BH
    type: web
    url: https://agendabh.com.br/
    follow_links:
      # articles live under a section: /evento/..., /espetaculo/..., /destaque/...
      include: ['agendabh\.com\.br/(evento|espetaculo|destaque|show|exposicao|cinema|concerto)/[a-z0-9-]{8,}/?$']
      max: 10
    enabled: true

  - name: Circuito Liberdade
    type: web
    url: https://circuitoliberdade.com.br/agenda?cat=&date_from={date_from}&date_to={date_to}
    pages:
      - https://circuitoliberdade.com.br/agenda?cat=&date_from={date_from}&date_to={date_to}&page=2
    default_venue_hint: Circuito Liberdade (Praça da Liberdade e arredores)
    enabled: true

  - name: Mapa Cultural BH
    type: mapas
    url: https://mapaculturalbh.pbh.gov.br
    fallback_url: https://mapaculturalbh.pbh.gov.br/eventos/
    enabled: true

  - name: Sou BH
    type: web
    url: https://soubh.uai.com.br/agenda
    follow_links:
      include: ['soubh\.uai\.com\.br/agenda/[a-z-]+/[a-z0-9-]{12,}/?$']
      max: 10
    enabled: true

  - name: Cine Belas Artes
    type: web
    url: https://www.belasartescine.com.br/
    default_venue_hint: Cine Belas Artes — Rua Gonçalves Dias, 1581, Lourdes
    extract_hint: >-
      É a programação semanal de um cinema. Para cada filme em cartaz, crie UMA
      entrada só (não uma por sessão): start = primeiro dia da semana de
      programação, end = último dia, category = Cinema, e coloque na descrição
      os horários das sessões e o gênero. Sessões especiais com data própria
      (debates, pré-estreias, clubes) viram entradas separadas com data e hora.
      price_text = faixa de preços da tabela de ingressos (ex.: "R$ 13 a R$ 26").
    enabled: true

  - name: Cine Theatro Brasil
    type: web
    url: https://www.cinetheatrobrasil.com.br/programacao/
    default_venue_hint: Cine Theatro Brasil Vallourec, Centro (salas Grande Theatro Unimed-BH e Teatro de Câmara)
    extract_hint: >-
      As datas aparecem sem mês ou ano (ex.: "21 de novembro", "21 e 22 de novembro").
      Para "21 e 22 de novembro" crie uma entrada por dia. Coloque a sala no campo venue
      junto com o nome do teatro. Horário e preço quase nunca aparecem: deixe vazio.
    enabled: true

  - name: Palácio das Artes
    type: web
    url: https://site.bileto.sympla.com.br/palaciodasartes/
    frames: true          # the agenda is an embedded Sympla widget
    scroll: 3
    default_venue_hint: Palácio das Artes — Av. Afonso Pena, 1537, Centro
    follow_links:
      include: ['sympla\.com\.br/(evento|eventos)/[a-z0-9-]+/\d+', 'bileto\.sympla\.com\.br/event/\d+']
      max: 10
    enabled: true

  - name: Cine Humberto Mauro
    type: web
    url: https://www.cinehumbertomauromais.com/programacao
    default_venue_hint: Cine Humberto Mauro — Palácio das Artes, Centro
    extract_hint: >-
      É a grade de um cinema. As sessões ficam sob títulos de data como "11/11 QUA" e cada
      linha começa com o horário ("17h"). Crie uma entrada por sessão: title = título em
      português do filme (ou o original se não houver), start = data + horário,
      category = Cinema, description = diretor, país, ano, duração e notas como
      "Sessão apresentada" ou o nome da mostra. "23h59" é a sessão da meia-noite daquele dia.
      Ignore dias sem programação.
    enabled: true

  - name: Shotgun
    type: web
    url: https://shotgun.live/pt-br/cities/belo-horizonte
    scroll: 4
    extract_hint: >-
      É uma lista de festas e shows agrupados por data, com local, horário e preço.
      Use category = Festa para festas e baladas, Música para shows.
    enabled: true

  - name: Clube de Jazz do Café
    type: web
    url: https://clubedejazzdocafe.com/shows/
    default_venue_hint: Clube de Jazz do Café — R. Antônio de Albuquerque, 47, Savassi
    extract_hint: >-
      Lista de shows de jazz, com dia da semana e dia/mês (sem ano), horário de
      abertura da casa e horários dos sets. start = horário do primeiro set;
      coloque a abertura da casa e os sets na descrição. "Ingressos na porta" vai
      na descrição; price_text fica vazio se não houver valor. category = Música.
    enabled: true

  - name: Filarmônica de Minas Gerais
    type: web
    url: https://filarmonica.art.br/agenda/
    default_venue_hint: Sala Minas Gerais — Barro Preto
    extract_hint: >-
      Agenda de concertos. Concerto com mais de uma data (ex.: "03 e 04 de dezembro")
      vira uma entrada por data. "gratuito" = price_text "Grátis". Se disser que os
      ingressos gratuitos são retirados a partir de uma data, ponha isso na descrição.
      Use o link "saiba mais" de cada concerto como url. category = Música.
    enabled: true

  - name: Mina Jazz
    type: web
    url: https://reserva.meep.com.br/minajazz
    scroll: 2
    default_venue_hint: Mina Jazz
    extract_hint: >-
      Página de reservas de uma casa de jazz. Cada show ou noite com data é um
      evento (category = Música). Ignore cardápio, mesas e opções de reserva que
      não sejam shows com data.
    enabled: true

  - name: Juramento 202
    type: manual
    file: eventos_fixos/juramento202.yaml
    enabled: true

  - name: '@strvbh'
    type: instagram
    handle: strvbh
    enabled: false   # turn on after setting up an Instagram login (README step 4)

  - name: '@rolesdocarmona'
    type: instagram
    handle: rolesdocarmona
    enabled: false   # turn on after setting up an Instagram login (README step 4)
